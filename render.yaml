services:
  - type: web
    name: mine-manager-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: APP_VERSION
        value: 1.0.0

      - key: APP_ENV
        value: production

      - key: DEBUG
        value: "false"

      - key: LOG_LEVEL
        value: INFO

      - key: FORCE_HTTPS
        value: "true"

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "5432"

      - key: DB_NAME
        sync: false

      - key: DB_USER
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: SECRET_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: CORS_ORIGINS
        sync: false

      - key: STORAGE_PATH
        value: app/storage